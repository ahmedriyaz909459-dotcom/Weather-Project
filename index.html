<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Weather Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<link rel = "stylesheet" href="../styles.css"> 
</head>
<body>
<div class="container">
  <h1>Weather</h1>
  <p class="subtitle">Real-time weather for any city in the world</p>

  <div class="search-row">
    <input type="text" id="cityInput" placeholder="Enter city name… e.g. London, Tokyo" />
    <button id="searchBtn" onclick="fetchWeather()">Search</button>
  </div>

  <div class="error" id="errorMsg"></div>

  <div class="hero" id="hero">
    <div class="hero-top">
      <div class="hero-location">
        <div class="country" id="country"></div>
        <div class="city" id="city"></div>
        <div class="desc" id="desc"></div>
      </div>
      <div class="hero-icon" id="icon"></div>
    </div>
    <div class="hero-temp" id="temp"></div>
    <div class="hero-feels" id="feels"></div>
  </div>

  <div class="local-time" id="localTime"></div>

  <div class="stats" id="stats">
    <div class="stat">
      <div class="stat-icon">💧</div>
      <div class="stat-label">Humidity</div>
      <div class="stat-val" id="humidity"></div>
    </div>
    <div class="stat">
      <div class="stat-icon">💨</div>
      <div class="stat-label">Wind</div>
      <div class="stat-val" id="wind"></div>
    </div>
    <div class="stat">
      <div class="stat-icon">👁️</div>
      <div class="stat-label">Visibility</div>
      <div class="stat-val" id="visibility"></div>
    </div>
    <div class="stat">
      <div class="stat-icon">🌡️</div>
      <div class="stat-label">Pressure</div>
      <div class="stat-val" id="pressure"></div>
    </div>
  </div>

  <div class="placeholder" id="placeholder">
    <div class="big-icon">🌍</div>
    <p>Search for a city to see the weather</p>
  </div>
</div>

<script>
  // ⚠️  Replace with your own free API key from https://openweathermap.org/api
  const API_KEY = "bd5e378503939ddaee76f12ad7a97608";

  const themes = {
    clear:        { bg: "linear-gradient(135deg,#1a6fc4,#3aa0e0)", icon: "☀️" },
    clouds:       { bg: "linear-gradient(135deg,#3d4f61,#5c6b7a)", icon: "☁️" },
    rain:         { bg: "linear-gradient(135deg,#1c3550,#2c4a6e)", icon: "🌧️" },
    drizzle:      { bg: "linear-gradient(135deg,#2a4060,#3a5068)", icon: "🌦️" },
    thunderstorm: { bg: "linear-gradient(135deg,#1a1a2e,#2b2d42)", icon: "⛈️" },
    snow:         { bg: "linear-gradient(135deg,#5a8fa8,#7dafc4)", icon: "❄️" },
    mist:         { bg: "linear-gradient(135deg,#5a6a78,#8a9ba8)", icon: "🌫️" },
    fog:          { bg: "linear-gradient(135deg,#5a6a78,#8a9ba8)", icon: "🌫️" },
    haze:         { bg: "linear-gradient(135deg,#7a6a40,#a0956a)", icon: "🌤️" },
    dust:         { bg: "linear-gradient(135deg,#8a7040,#b5a27a)", icon: "🌪️" },
    smoke:        { bg: "linear-gradient(135deg,#4a4a4a,#6a6a6a)", icon: "🌫️" },
    default:      { bg: "linear-gradient(135deg,#2a5080,#4a7fa8)", icon: "🌡️" },
  };

  function getTheme(main) {
    return themes[(main || "").toLowerCase()] || themes.default;
  }

  function formatLocalTime(offsetSeconds) {
    const now = new Date();
    const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
    const local = new Date(utcMs + offsetSeconds * 1000);
    return local.toLocaleString([], {
      weekday: "long", month: "short", day: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  }

  async function fetchWeather() {
    const city = document.getElementById("cityInput").value.trim();
    if (!city) return;

    const btn = document.getElementById("searchBtn");
    const err = document.getElementById("errorMsg");
    err.style.display = "none";
    btn.innerHTML = '<span class="spinner"></span>Loading…';
    btn.disabled = true;

    try {
      const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&units=metric&appid=${API_KEY}`;
      const res = await fetch(url);
      const data = await res.json();

      if (!res.ok) throw new Error(data.message || "City not found");

      const main = data.weather[0].main;
      const theme = getTheme(main);

      // Hero
      const hero = document.getElementById("hero");
      hero.style.background = theme.bg;
      hero.style.display = "block";
      hero.classList.remove("anim-in");
      void hero.offsetWidth;
      hero.classList.add("anim-in");

      document.getElementById("country").textContent = data.sys.country;
      document.getElementById("city").textContent = data.name;
      document.getElementById("desc").textContent = data.weather[0].description;
      document.getElementById("icon").textContent = theme.icon;
      document.getElementById("temp").textContent = Math.round(data.main.temp) + "°C";
      document.getElementById("feels").textContent =
        `Feels like ${Math.round(data.main.feels_like)}°C  ·  High ${Math.round(data.main.temp_max)}°  Low ${Math.round(data.main.temp_min)}°`;

      // Stats
      document.getElementById("humidity").textContent = data.main.humidity + "%";
      document.getElementById("wind").textContent = Math.round(data.wind.speed * 3.6) + " km/h";
      document.getElementById("visibility").textContent =
        data.visibility ? (data.visibility / 1000).toFixed(1) + " km" : "—";
      document.getElementById("pressure").textContent = data.main.pressure + " hPa";

      // Time
      const timeEl = document.getElementById("localTime");
      timeEl.textContent = "Local time: " + formatLocalTime(data.timezone);
      timeEl.style.display = "block";

      document.getElementById("stats").style.display = "grid";
      document.getElementById("placeholder").style.display = "none";

    } catch (e) {
      err.textContent = `Could not find weather for "${city}". Check the city name and try again.`;
      err.style.display = "block";
    } finally {
      btn.innerHTML = "Search";
      btn.disabled = false;
    }
  }

  document.getElementById("cityInput").addEventListener("keydown", e => {
    if (e.key === "Enter") fetchWeather();
  });
</script>
</body>
</html>
